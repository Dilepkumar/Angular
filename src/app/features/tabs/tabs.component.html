<div class="min-h-screen relative" style="background: var(--bg);">
  <main class="pb-24">
    <router-outlet />
  </main>

  <!-- PWA Bottom Navigation Bar (4 icons: Home, Settle, Bills, Pool) -->
  <nav class="fixed bottom-0 inset-x-0 grid grid-cols-4 z-40 shadow-lg border-t"
       style="background: var(--card); border-color: var(--border); padding-bottom: max(env(safe-area-inset-bottom, 0px), 6px);">
    @for (tab of tabs; track tab.path) {
      <a [routerLink]="tab.path"
         routerLinkActive="active-tab"
         class="flex flex-col items-center justify-center h-16 sm:h-18 transition-all group select-none no-underline"
         style="color: var(--t3);">
        <span class="text-2xl transition-transform group-hover:scale-110 group-active:scale-95 leading-none mb-1">
          {{ tab.icon }}
        </span>
        <span class="text-[11px] font-extrabold tracking-tight">
          {{ tab.label }}
        </span>
      </a>
    }
  </nav>
</div>
