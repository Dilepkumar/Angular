<div class="min-h-dvh bg-slate-50 p-6 pt-10">
  @if (step() === 1) {
    <h1 class="text-2xl font-bold mb-4">Forgot password</h1>
    <p class="text-slate-500 text-sm mb-4">Enter your email — we'll send a reset code.</p>
    <input [(ngModel)]="email" type="email" placeholder="Email"
           class="w-full border rounded-xl px-4 py-3 mb-4" />
    @if (error()) { <p class="text-red-600 text-sm mb-2">{{ error() }}</p> }
    <button (click)="sendOtp()" [disabled]="loading()"
            class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl disabled:opacity-40">
      {{ loading() ? 'Sending…' : 'Send Code' }}
    </button>
  } @else {
    <h1 class="text-2xl font-bold mb-4">Reset password</h1>
    @if (devOtp()) {
      <div class="bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-2xl p-3 mb-4">
        🛠 Dev OTP: <b class="tracking-widest">{{ devOtp() }}</b>
      </div>
    }
    <input [(ngModel)]="code" placeholder="6-digit code" maxlength="6" inputmode="numeric"
           class="w-full border rounded-xl px-4 py-3 mb-4" />
    <input [(ngModel)]="newPassword" type="password" placeholder="New password (min 8 chars)"
           class="w-full border rounded-xl px-4 py-3 mb-4" />
    @if (error()) { <p class="text-red-600 text-sm mb-2">{{ error() }}</p> }
    @if (success()) {
      <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-2xl p-3 mb-4">
        ✅ Password updated! <a routerLink="/auth/login" class="font-bold underline">Go to login</a>
      </div>
    }
    <button (click)="reset()" [disabled]="loading() || success()"
            class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl disabled:opacity-40">
      {{ loading() ? 'Updating…' : success() ? 'Done' : 'Reset Password' }}
    </button>
  }
  <p class="mt-6 text-center"><a routerLink="/auth/login" class="text-emerald-600 text-sm">← Back to login</a></p>
</div>
