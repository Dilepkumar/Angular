<div class="min-h-dvh flex flex-col justify-center p-6 bg-gradient-to-b from-emerald-600 to-teal-700">
  <div class="text-center text-white mb-8">
    <div class="text-5xl">🏠</div>
    <h1 class="text-2xl font-bold mt-2">RoomLedger</h1>
    <p class="text-emerald-200 text-sm">Bills · IOU · Pool — sorted.</p>
  </div>

  <div class="bg-white rounded-3xl p-6 shadow-xl space-y-4">
    <div>
      <label class="text-sm font-medium text-slate-600">Email</label>
      <input type="email" [(ngModel)]="email" placeholder="you@gmail.com"
             class="w-full mt-1 border rounded-xl px-4 py-3 focus:ring-2 ring-emerald-500 outline-none" />
    </div>
    <div>
      <label class="text-sm font-medium text-slate-600">Password</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••"
             (keyup.enter)="submit()"
             class="w-full mt-1 border rounded-xl px-4 py-3 focus:ring-2 ring-emerald-500 outline-none" />
    </div>

    @if (error()) {
      <p class="text-red-600 text-sm bg-red-50 rounded-xl p-3">{{ error() }}</p>
    }

    <button (click)="submit()" [disabled]="loading()"
            class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl
                   disabled:opacity-50 active:scale-[0.98] transition">
      {{ loading() ? 'Signing in…' : 'Sign In' }}
    </button>

    <div class="flex justify-between text-sm">
      <a routerLink="/auth/forgot-password" class="text-emerald-600">Forgot password?</a>
      <a routerLink="/auth/register" class="text-emerald-600 font-semibold">Create account</a>
    </div>
  </div>
</div>
