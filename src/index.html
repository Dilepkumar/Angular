<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RoomLedger — Smart Expense Sharing</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1ABC9C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body class="t3">
    <app-root>
      <style>
        .rl-preloader {
          position: fixed;
          inset: 0;
          background: #F8FFFE;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 99999;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          user-select: none;
          -webkit-user-select: none;
        }
        .rl-logo-wrapper {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        .rl-logo-glow {
          position: absolute;
          width: 120px;
          height: 120px;
          border-radius: 32px;
          background: radial-gradient(circle, rgba(26, 188, 156, 0.45) 0%, rgba(26, 188, 156, 0) 70%);
          filter: blur(12px);
          z-index: 1;
          opacity: 0;
          animation: rlGlowPulse 1.6s ease-out 0.2s forwards;
        }
        .rl-main-logo {
          position: relative;
          width: 96px;
          height: 96px;
          border-radius: 24px;
          object-fit: cover;
          z-index: 2;
          box-shadow: 
            0 16px 36px -10px rgba(0, 0, 0, 0.22),
            0 6px 16px rgba(26, 188, 156, 0.25);
          animation: rlSpringIn 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
          transform-origin: center center;
        }
        .rl-tag {
          margin-top: 18px;
          font-size: 11px;
          font-weight: 800;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #1ABC9C;
          opacity: 0;
          animation: rlFadeUp 0.55s ease-out 0.28s forwards;
          z-index: 2;
        }
        .rl-loader-pill {
          margin-top: 22px;
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 6px 14px;
          border-radius: 999px;
          background: rgba(26, 188, 156, 0.1);
          color: #12826c;
          border: 1px solid rgba(26, 188, 156, 0.2);
          font-size: 11px;
          font-weight: 600;
          opacity: 0;
          animation: rlFadeUp 0.5s ease-out 0.45s forwards;
          z-index: 2;
        }
        .rl-spinner-dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #1ABC9C;
          animation: rlPulse 1s infinite ease-in-out;
        }
        @keyframes rlSpringIn {
          0% {
            opacity: 0;
            transform: scale(0.4) translateY(20px) rotate(-3deg);
          }
          60% {
            opacity: 1;
            transform: scale(1.06) translateY(-2px) rotate(0.5deg);
          }
          80% {
            transform: scale(0.97) translateY(1px);
          }
          100% {
            opacity: 1;
            transform: scale(1) translateY(0) rotate(0);
          }
        }
        @keyframes rlGlowPulse {
          0% { opacity: 0; transform: scale(0.5); }
          60% { opacity: 0.9; transform: scale(1.15); }
          100% { opacity: 0.6; transform: scale(1); }
        }
        @keyframes rlFadeUp {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes rlPulse {
          0%, 100% { opacity: 0.4; transform: scale(0.85); }
          50% { opacity: 1; transform: scale(1.25); }
        }
      </style>

      <div class="rl-preloader">
        <div class="rl-logo-wrapper">
          <div class="rl-logo-glow"></div>
          <img class="rl-main-logo" src="icons/icon-192x192.png" srcset="icons/icon-512x512.png 2x" alt="RoomLedger Logo" width="96" height="96" />
        </div>
        <div class="rl-tag">Smart Expense Sharing</div>
        <div class="rl-loader-pill">
          <div class="rl-spinner-dot"></div>
          <span>Starting RoomLedger…</span>
        </div>
      </div>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
